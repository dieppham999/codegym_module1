<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR-Lite – Quản lý nhân sự</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>HR-Lite</h1>
    <p>Hệ thống quản lý nhân sự</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Thêm nhân viên</h2>
      <form id="employee-form" novalidate>
        <input type="hidden" id="employee-id">
        <label>Họ tên
          <input type="text" id="employee-name" placeholder="VD: Nguyễn Văn An">
        </label>
        <label>Chức vụ
          <input type="text" id="employee-position" placeholder="VD: Developer">
        </label>
        <label>Lương (VNĐ)
          <input type="number" id="employee-salary" min="0" step="1" placeholder="VD: 15000000">
        </label>
        <p id="form-error" class="error" role="alert"></p>
        <div class="actions">
          <button type="submit" id="submit-btn">Thêm</button>
          <button type="button" id="cancel-edit" hidden>Hủy sửa</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Tìm theo tên...">
        <p class="total">Tổng quỹ lương: <strong id="total-salary">0 ₫</strong></p>
      </div>
      <table>
        <thead>
          <tr><th>Họ tên</th><th>Chức vụ</th><th>Lương</th><th></th></tr>
        </thead>
        <tbody id="employee-list"></tbody>
      </table>
      <p id="empty-message" class="empty" hidden>Không có nhân viên nào.</p>
    </section>
  </main>
</body>
</html>
