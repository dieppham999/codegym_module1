<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GateKeeper – MegaCorp</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    main { max-width: 560px; padding: 32px; border: 1px solid #334155; border-radius: 12px; background: #1e293b; text-align: center; }
    h1 { margin-top: 0; font-size: 26px; }
    #status { margin-bottom: 0; padding: 10px; border-radius: 8px; background: #334155; }
    #status.success { background: #14532d; }
    #status.denied { background: #7f1d1d; }
  </style>
  <!-- External JS + defer: tải song song, chạy sau khi HTML phân tích xong, không chặn hiển thị -->
  <script src="security.js" defer></script>
</head>
<body>
  <main>
    <h1>Chào mừng đến với hệ thống nội bộ MegaCorp</h1>
    <p>Nội dung tuyệt mật...</p>
    <p id="status">Đang khởi động cổng an ninh...</p>
  </main>
</body>
</html>
